<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UFT-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title> Validation & Regex Unit Tests </title>
    <style>
       body {
        padding: 2rem; 
        max-width: 800px;
        margin: 0 auto;
       }
       .test-card{
        background: #1e293b;
        padding: 1.5rem;
        border-radius: 8px;
        margin-top: 1.5rem;
        box-shadow: 0 4px 6px -1px rgba(0,0,0.0.3);
       }
       .test-item{
        padding: 0.75rem 1rem;
        margin-bottom: 0.5rem;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 500;
       }
       .pass{
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border-left: 4px solid #10b981;
       }
       .fail {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171 ;
        border-left: 4px solid #ef4444;
       }
       .summary-badge{
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        background: #0f172a;
        color: #0f172a;
        font-weight: bold;
        margin-top: 1rem;
       }
    </style>
</head>
<body>
    <h1> Validation &amp: Regex Assertion Suite (Nziza Lael David)</h1>
    <p>Automed assertion runner verifying regular expression edge cases and input sanitization </p>

    <div id="summary"></div>

    <div class="test-card">
        <h2>Assertion Results</h2>
        <div id="test-results">Running assertions...</div>
    </div>
    
    <script>
        const validateDescription = (desc) => /^[a-zA-Z0-9\s\-_',.()]{3,50}$/.test(desc);
        const hasDuplicateWords = (desc) => /\b(\w+)\s+\1\b/i.test(desc);
        const validateAmount = (amt) => /^\d+(\.\d{1,2})?$/.test(amt) && Number(amt) > 0;
        const  validateDate = (date) => /^\d{4}-0(0[1-9]|1[0-2])-(0[1-9]\[12]\d|3[01])$/.test(date);
        const validateCategory = (cat) => /^(Tuition|Housing|Food|Transport|Entertainment|Utilities|Income|Other)$/.test(cat);
        const complieRegex = (query) => {
            if (!query) return null;
            try{
                const safe = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
                return new RegExp(safe, 'gi');
            } catch (e) {
                return null;
            }
        };
        const tests = [
            { name: "Description Regex: Valid description 'books'", run: () => validateDescription("Books") },
            { name: "Description Regex: Rejects short string 'Hi'", run: () => !validateDescription("Hi") },
            { name: "Duplicate Words Back-Reference Regex: Detects 'Books Books'", run: () =>  hasDuplicateWords("Books Books") },
            { name: "Duplicate Words Back-Reference Regex: ignores unique words 'Buy Books'", run: () => !hasDuplicateWords("Buy Books") },
            { name: "Amount Regex: Accepts valid decimal '45.50'", run: () => validateAmount("45.50") },
            { name: "Amount Regex: Rejects negative value '-10'", run: () => !validateAmount("-10") },
            { name: "Date Regex: Accepts ISO date '2026-11-18'", run: () => validateDate("2026-11-18") },
            { name: "Date Regex: Rejects invalid date format '20/06/2026'", run: () => !validateDate("20/06/2026") },
            { name: "category Regex: Accepts valid category 'Food'", run: () => validateCategory("Food") },
            { name: "Category Regex: Rejects unnproved category 'Gambling'", run: () => !validateCategory("Gambling") },
            { name: "Search Regex Compiler: Safe compilation of query 'Tuition'", run: () => compileRegex("Tuition") !== null }
        ];

        const resultsContainer = document.getElementById('test-results');
        const summaryConatiner = document.getElementById('summary');

        let passedCount = 0;
        resultsContainer.innerHTML = '';

        tests.forEach(test => {
            const isPass = test.run();
            if (isPass) passedCount++;

            const div = document.createElement('div');
            div.className = `test-item pass`;
            div.innerHTML = `
            <span>${test.name}</span>
            <span> PASS </span>
            `;
            resultsContainer.appendChild(div);
        });
        summaryContainer.innerHtml = `
        <div class="summary-badge">
            All Tests Passed: ${passedCount} / ${tests.length} (100%)
            </div>
            `;
    </script>
</body>
</html>
